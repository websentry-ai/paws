description = "warn: Claude Code shows the human an approval prompt with the rule's message; approving runs the command"
prompt = "Run exactly this command with the Bash tool and show me the output: psql -h prod-db.internal -c 'select 1'"
allowed_tools = ["Bash(psql:*)"]
answer = "yes"
env = { PSQL_LOG = "{project}/.psql.log" }

[expect]
screen_contains = ["WRN-4F"]
prompts = 1
audit = [{ rule = "prod-db-approval", verdict = "ask", action = "warn" }]
shell = ["grep -q prod-db.internal .psql.log"]
