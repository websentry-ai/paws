description = "paws skill: 'remind about docs/STYLE.md when editing .tsx, don't block' becomes an advise rule on writes only"
prompt = "When the agent edits or writes any .tsx file, remind it to follow docs/STYLE.md. Don't block anything, just a reminder. Set that up with paws."
allowed_tools = ["Skill", "Read", "Write", "Edit", "Glob", "Bash(paws:*)", "Bash(mkdir:*)", "Bash(ls:*)"]
timeout = 300

[expect]
skills_invoked = ["paws"]
tool_result_contains = ["decision:"]
shell = [
  "paws explain --tool Edit src/App.tsx | grep -q 'allow + context.*STYLE.md'",
  "paws explain --tool Write src/components/Button.tsx | grep -q 'allow + context.*STYLE.md'",
  "paws explain --tool Read src/App.tsx | grep -q 'allow (no matching gate)'",
  "paws explain --tool Edit src/app.ts | grep -q 'allow (no matching gate)'",
  "! paws explain --tool Edit src/App.tsx | grep -q DENY",
]
