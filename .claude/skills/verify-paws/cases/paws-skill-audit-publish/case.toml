description = "paws skill: 'record every npm publish, don't stop it' becomes an audit rule"
prompt = "Keep a record every time the agent runs npm publish, but never stop it. Set that up with paws."
allowed_tools = ["Skill", "Read", "Write", "Edit", "Glob", "Bash(paws:*)", "Bash(mkdir:*)", "Bash(ls:*)"]
timeout = 300

[expect]
skills_invoked = ["paws"]
tool_result_contains = ["decision:"]
shell = [
  "paws explain 'npm publish' | grep -q '→.*action=audit'",
  "paws explain 'npm publish --access public' | grep -q '→.*action=audit'",
  "paws explain 'npm publish' | grep -q '^  allow'",
  "! paws explain 'npm install' | grep -q '→'",
]
