description = "paws skill: 'when my prompt mentions deploying' becomes a user-prompt prompt-inject rule"
prompt = "Whenever my prompt mentions deploying, remind the agent to run the smoke tests (make smoke) before it deploys. Set that up in this repo with paws."
allowed_tools = ["Skill", "Read", "Write", "Edit", "Glob", "Bash(paws:*)", "Bash(mkdir:*)", "Bash(ls:*)"]
timeout = 300

[expect]
skills_invoked = ["paws"]
tool_result_contains = ["decision:"]
shell = [
  "paws explain --event user-prompt 'deploy the api to staging' | grep -qi 'allow + context:.*smoke'",
  "paws explain --event user-prompt 'can you handle deploying the worker' | grep -qi 'allow + context:.*smoke'",
  "paws explain --event user-prompt 'fix the login bug' | grep -q 'allow (no matching gate)'",
  "grep -rqE '^event: user-prompt' .paws",
]
