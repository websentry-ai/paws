description = "paws skill: 'ask me before psql against prod' becomes a warn rule scoped to the prod host"
prompt = "Before the agent runs psql against our production database, ask me first. Prod is db.prod.internal. psql against localhost is fine. Set that up with paws."
allowed_tools = ["Skill", "Read", "Write", "Edit", "Glob", "Bash(paws:*)", "Bash(mkdir:*)", "Bash(ls:*)"]
timeout = 300

[expect]
skills_invoked = ["paws"]
tool_result_contains = ["decision:"]
shell = [
  "paws explain 'psql -h db.prod.internal -U app app' | grep -q 'ASK'",
  "paws explain 'psql postgres://app@db.prod.internal:5432/app' | grep -q 'ASK'",
  "paws explain 'PGPASSWORD=x psql -h db.prod.internal -c \"select 1\"' | grep -q 'ASK'",
  "paws explain 'psql -h localhost -U app app' | grep -q 'allow (no matching gate)'",
  "paws explain 'psql' | grep -q 'allow (no matching gate)'",
]
