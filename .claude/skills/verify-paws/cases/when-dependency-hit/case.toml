description = "when dependency:stripe gates commits in a repo that depends on stripe"
prompt = "Create an empty git commit in this repo with the message 'initial'. Use the Bash tool."
allowed_tools = ["Bash(git:*)", "Skill"]

[expect]
skills_invoked = ["payments-review"]
audit = [
  { rule = "stripe-commit", verdict = "deny" },
  { rule = "stripe-commit", verdict = "allow", satisfied_by = "skill-load" },
]
shell = ["git log -1 --format=%s | grep -q '^PAY-OK: '"]
