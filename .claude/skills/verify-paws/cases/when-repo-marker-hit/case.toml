description = "when repo-marker:infra/terraform gates commits in a repo that has the marker"
prompt = "Create an empty git commit in this repo with the message 'initial'. Use the Bash tool."
allowed_tools = ["Bash(git:*)", "Skill"]

[expect]
skills_invoked = ["ledger-notes"]
audit = [
  { rule = "infra-commit", verdict = "deny" },
  { rule = "infra-commit", verdict = "allow", satisfied_by = "skill-load" },
]
audit_max = [{ rule = "infra-commit", verdict = "deny", max = 1 }]
shell = ["git log -1 --format=%s | grep -q '^TFM-3K: '"]
