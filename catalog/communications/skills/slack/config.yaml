# Filled into SKILL.md at install: each KEY placeholder gets its value. Angle-bracket values are
# org settings with no safe default; SKILL.md "Defaults" says what applies until set.
placeholders:
  AGENT_IDENTITY_CONVENTION: '[sent by AI agent on behalf of <user>]'
  ANNOUNCE_CHANNELS: '#general, #announcements or any all-* channel'
  CHANNEL_TOPIC_REGISTRY: <channel-topic-registry>
  EXTERNAL_DOMAINS_POLICY: treat any non-org email domain as external
  INCIDENT_CHANNEL: <incident-channel>
  MASS_PING_THRESHOLD: '5'
  ORG_VOICE_GUIDE: 'the org voice guide (default: plain, concise, no emojis)'
  SEND_APPROVAL_POLICY: 'default: draft-first for external recipients and mass sends; internal one-offs narrated and sent'
  SENSITIVITY_TIERS: anything not already public
  SLACK_WORKSPACE: the workspace the token was issued for
