# Filled into SKILL.md at install: each KEY placeholder gets its value. Angle-bracket values are
# org settings with no safe default; SKILL.md "Defaults" says what applies until set.
placeholders:
  AGENT_ATTRIBUTION_CONVENTION: '[created-by: ai-agent]'
  AGENT_LEAD_SOURCE: AI Agent
  ARCHIVE_PATH: marking the record inactive/archived via the org's standard flag
  BULK_THRESHOLD: '10'
  DEDUP_MATCH_FIELDS: email (people), website domain (companies)
  DEFAULT_RECORD_OWNER: <record-owner>
  REQUIRED_FIELDS_REGISTRY: <required-fields-registry>
  SF_ORG_ALIAS: <sf-org>
