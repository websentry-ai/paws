# Filled into SKILL.md at install: each KEY placeholder gets its value. Angle-bracket values are
# org settings with no safe default; SKILL.md "Defaults" says what applies until set.
placeholders:
  AGENT_ATTRIBUTION_CONVENTION: the created-by:ai-agent job label
  BQ_PROJECT: <bq-project>
  CURATED_DATASETS: any dataset not matching the scratch naming convention
  SCAN_CONFIRM_THRESHOLD: 100 GB
  SCRATCH_NAMING: scratch_<user>
  SCRATCH_TTL: 7 days
  SCRATCH_TTL_SECONDS: '604800'
  SENSITIVITY_TIERS: policy-tagged columns plus obvious PII names (email, phone, ssn, dob, address)
  TRANSFORM_TOOL: the repo's dbt project
